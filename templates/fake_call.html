<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(900px 700px at 30% 0%, rgba(255,255,255,0.12), transparent 55%),
                radial-gradient(1100px 800px at 70% 30%, rgba(20, 184, 166, 0.20), transparent 55%),
                linear-gradient(180deg, #0b1220 0%, #05070b 100%);
            color: white;
        }

        .phone {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 14px) 22px env(safe-area-inset-bottom, 22px);
            position: relative;
        }

        .statusbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 2px;
            font-size: 14px;
            opacity: 0.92;
            letter-spacing: 0.2px;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.9;
        }

        .pill {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 34px;
            border-radius: 18px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.10);
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .incoming-label {
            margin-top: 10px;
            text-align: center;
            font-size: 16px;
            opacity: 0.86;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.72; }
            50% { opacity: 1; }
        }

        .caller {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 0 30px;
        }

        .avatar {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin-bottom: 18px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.35);
        }

        .caller-name {
            font-size: 40px;
            font-weight: 650;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
            text-shadow: 0 10px 25px rgba(0,0,0,0.35);
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .caller-number {
            font-size: 16px;
            opacity: 0.78;
        }

        .ringing {
            margin-top: 16px;
            font-size: 14px;
            opacity: 0.72;
        }

        .actions {
            padding-bottom: 8px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 26px;
            align-items: center;
            justify-items: center;
        }

        .btn {
            width: 78px;
            height: 78px;
            border-radius: 39px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
            transition: transform 0.12s ease;
        }

        .btn:active { transform: scale(0.96); }

        .btn.decline { background: #dc2626; }
        .btn.accept  { background: #16a34a; }

        .btn-labels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 26px;
            margin-top: 10px;
            font-size: 13px;
            opacity: 0.86;
            text-align: center;
        }

        .exit {
            position: absolute;
            top: 58px;
            right: 18px;
            background: rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.92);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(10px);
        }

        .in-call {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .in-call.active { display: flex; }

        .call-connected {
            font-size: 16px;
            opacity: 0.85;
            margin-top: 6px;
        }

        .duration {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 42px;
            letter-spacing: 1px;
            margin-top: 18px;
            opacity: 0.95;
            text-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }

        .end {
            margin-top: 34px;
            width: 78px;
            height: 78px;
            border-radius: 39px;
            background: #dc2626;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            50% { transform: translateX(2px); }
            75% { transform: translateX(-2px); }
            100% { transform: translateX(0); }
        }

        .shake { animation: shake 0.6s ease-in-out infinite; }

        /* Make it feel like a phone screen on desktop too */
        @media (min-width: 520px) {
            .phone {
                max-width: 420px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="pill" aria-hidden="true"></div>
        <div class="statusbar" aria-hidden="true">
            <div id="time">--:--</div>
            <div class="status-icons">
                <span>5G</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="14" width="3" height="7" rx="0.5"/><rect x="8" y="10" width="3" height="11" rx="0.5"/><rect x="14" y="6" width="3" height="15" rx="0.5"/><rect x="20" y="2" width="3" height="19" rx="0.5"/></svg>
                <svg width="22" height="16" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="19" height="14" rx="2.5"/><rect x="22" y="5.5" width="2" height="5" rx="1" fill="currentColor" stroke="none"/><rect x="3" y="3" width="15" height="10" rx="1" fill="currentColor" stroke="none"/></svg>
            </div>
        </div>

        <button class="exit" onclick="exitCall()">Exit</button>

        <div id="incoming-call">
            <div class="incoming-label">Incoming call</div>

            <div class="caller shake" id="callerShake">
                <div class="avatar"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4 3.3-6.8 7.5-6.8s7.5 2.8 7.5 6.8"/></svg></div>
                <div class="caller-name">{{ caller_name }}</div>
                <div class="caller-number">{{ caller_number }}</div>
                <div class="ringing" id="ringing">Ringing…</div>
            </div>

            <div class="actions">
                <div class="buttons">
                    <button class="btn decline" onclick="declineCall()" aria-label="Decline call"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
                    <button class="btn accept" onclick="acceptCall()" aria-label="Accept call"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></button>
                </div>
                <div class="btn-labels" aria-hidden="true">
                    <div>Decline</div>
                    <div>Accept</div>
                </div>
            </div>
        </div>

        <div id="accepted-call" class="in-call">
            <div class="incoming-label">Call in progress</div>
            <div class="caller">
                <div class="avatar"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4 3.3-6.8 7.5-6.8s7.5 2.8 7.5 6.8"/></svg></div>
                <div class="caller-name">{{ caller_name }}</div>
                <div class="call-connected">Connected</div>
                <div class="duration" id="duration">00:00</div>
                <button class="end" onclick="endCall()" aria-label="End call"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
            </div>
        </div>
    </div>

    <script>
        let callTimer;
        let seconds = 0;

        function acceptCall() {
            document.getElementById('incoming-call').style.display = 'none';
            document.getElementById('accepted-call').classList.add('active');
            document.getElementById('callerShake')?.classList.remove('shake');
            
            // Start call timer
            callTimer = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('duration').textContent = 
                    `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }, 1000);
        }

        function declineCall() {
            showMessage('Call Declined');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        }

        function endCall() {
            clearInterval(callTimer);
            showMessage('Call Ended');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        }

        function exitCall() {
            if (confirm('Exit fake call screen?')) {
                window.location.href = '/dashboard';
            }
        }

        function showMessage(msg) {
            const el = document.getElementById('ringing');
            if (el) el.textContent = msg;
        }

        // Vibrate on load (if supported)
        if (navigator.vibrate) {
            navigator.vibrate([180, 120, 180, 120, 180]);
        }

        function updateTime() {
            const d = new Date();
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hh}:${mm}`;
        }
        updateTime();
        setInterval(updateTime, 5000);
    </script>
</body>
</html>
